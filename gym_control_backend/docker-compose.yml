version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gym-control-db
    environment:
      POSTGRES_DB: gym_control
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_user -d gym_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gym-control-app
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://gym_user:gym_password@postgres:5432/gym_control
      JWT_SECRET: dev-secret-key
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - /app/node_modules
    command: pnpm start:dev

volumes:
  postgres_data:

networks:
  default:
    name: gym-control-network
